# public/ 화면 미리보기용 GitHub Pages 배포.
# 정적 화면만 올라가므로 견적 전송과 관리자 목록(API 필요)은 동작하지 않는다.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['public/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
